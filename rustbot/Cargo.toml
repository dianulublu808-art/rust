[package]
name        = "rustbot"
version     = "0.1.0"
edition     = "2021"
authors     = ["rustbot"]
description = "Telegram userbot written in Rust"

[[bin]]
name = "rustbot"
path = "src/main.rs"

[dependencies]
grammers-client   = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
grammers-session  = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
tokio            = { version = "1", features = ["full"] }
anyhow           = "1"
thiserror        = "1"
serde            = { version = "1", features = ["derive"] }
toml             = "0.8"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait      = "0.1"
sysinfo          = "0.30"
tempfile         = "3"
chrono           = { version = "0.4", features = ["serde"] }

# core2 0.4.0 yanked on crates.io — overriding with git source (same code, not yanked)
[patch.crates-io]
core2 = { git = "https://github.com/technocreatives/core2" }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
