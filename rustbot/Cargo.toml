[package]
name        = "rustbot"
version     = "0.1.0"
edition     = "2021"
authors     = ["rustbot"]
description = "Telegram userbot written in Rust"

[[bin]]
name = "rustbot"
path = "src/main.rs"

[dependencies]
grammers-client  = { git = "https://github.com/Lonami/grammers" }
grammers-session = { git = "https://github.com/Lonami/grammers" }
tokio            = { version = "1", features = ["full"] }
anyhow           = "1"
thiserror        = "1"
serde            = { version = "1", features = ["derive"] }
toml             = "0.8"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait      = "0.1"
sysinfo          = "0.30"
tempfile         = "3"
chrono           = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
