[package]
name        = "rustbot"
version     = "1.0.0"
edition     = "2021"
authors     = ["rustbot"]
description = "Telegram userbot written in Rust (Heroku-compatible)"

[[bin]]
name = "rustbot"
path = "src/main.rs"

[dependencies]
grammers-client   = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
grammers-session  = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "174c67a5d7adf0dfcf6244b374de209a3735081b" }
tokio            = { version = "1", features = ["full"] }
anyhow           = "1"
thiserror        = "1"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait      = "0.1"
sysinfo          = "0.30"
tempfile         = "3"
chrono           = { version = "0.4", features = ["serde"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wasmi            = "0.40"

[dev-dependencies]
wat = "1"

[patch.crates-io]
core2 = { git = "https://github.com/technocreatives/core2" }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = true
